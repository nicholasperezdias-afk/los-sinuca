<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Poker Control — Gráficos</title><style>html,body{margin:0;background:transparent!important;color:white;font:900 24px Arial,sans-serif;overflow:hidden}.overlay{position:absolute;top:48px;left:54px;display:flex;gap:8px;align-items:start;max-width:1600px}.box{background:rgba(13,25,39,.93);border-left:5px solid #e6bd62;border-radius:9px;padding:14px 20px;box-shadow:0 7px 20px #0008;min-width:190px}.small{font-size:13px;letter-spacing:.14em;color:#d3dce5;font-weight:500}.gold{color:#ffd27c}.value{font-size:30px;margin-top:5px}.rows{display:grid;gap:5px}.row{display:flex;justify-content:space-between;gap:18px;font-size:17px}.status{font-size:12px;color:#edba64}.footer{position:absolute;bottom:30px;left:56px;padding:9px 16px;border-radius:8px;background:#0d1927df;font-size:15px}body[data-mode="pot"] #chiplist{display:none}body[data-mode="ranking"] #potbox{display:none}body[data-mode="ranking"] .footer{display:none}</style></head><body data-mode="all"><div class="overlay"><div class="box" id="potbox"><div class="small">POTE TOTAL</div><div id="pot" class="value gold">0</div><div id="blinds" class="status">BLINDS —</div></div><div class="box" id="chiplist"><div class="small">CHIP COUNT</div><div class="rows" id="rows" style="margin-top:12px"></div></div></div><div id="hand" class="footer"></div><script>
const base="https://ptppjdmsjcvagpjsvcfc.supabase.co/functions/v1/poker-control-online/",mode=new URLSearchParams(location.search).get('mode')||'all';document.body.dataset.mode=['pot','ranking','all'].includes(mode)?mode:'all';const fmt=x=>Number(x||0).toLocaleString('pt-BR'),esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function update(){try{const r=await fetch(base+'api/public',{cache:'no-store'});if(!r.ok)return;const s=await r.json();document.getElementById('pot').textContent=fmt(s.pot);document.getElementById('blinds').textContent=fmt(s.config.sb)+' / '+fmt(s.config.bb);document.getElementById('hand').textContent='MÃO '+s.handCount+' • '+s.street;document.getElementById('rows').innerHTML=s.players.filter(p=>p.stack>0||p.committed>0).sort((a,b)=>mode==='ranking'?b.stack-a.stack:a.seat-b.seat).map(p=>'<div class="row"><span>#'+p.seat+' '+esc(p.name)+(p.folded?' ✕':p.allin?' • ALL-IN':'')+'</span><span class="gold">'+fmt(p.stack)+'</span></div>').join('')}catch(e){}}
update();setInterval(update,1250);
</script></body></html>
